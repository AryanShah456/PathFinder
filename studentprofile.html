<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PathFinder | My Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>

  <style>
    :root { --bg-dark: #0b0f14; --card-bg: #111827; --accent-yellow: #facc15; --text-gray: #9ca3af; --input-bg: #0f172a; --border-color: #1f2937; --blue: #2563eb; }
    * { box-sizing: border-box; }
    body { background: var(--bg-dark); color: white; font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 60px; background: rgba(17, 24, 39, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
    .logo-icon { background: var(--accent-yellow); color: black; padding: 5px; border-radius: 6px; }
    .nav-links { display: flex; gap: 30px; font-size: 14px; }
    .nav-links a { color: var(--text-gray); text-decoration: none; transition: 0.3s; }
    .nav-links a:hover, .nav-links a.active { color: white; }
    .profile-area { display: flex; align-items: center; gap: 15px; font-size: 14px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--blue); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 14px; }

    .container { padding: 40px 60px; max-width: 600px; margin: 0 auto; }
    h1 { font-size: 32px; margin-bottom: 10px; }
    .subtitle { color: var(--text-gray); margin-bottom: 30px; font-size: 16px; }

    .card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 30px; }

    .info-row { background: var(--input-bg); border-left: 4px solid var(--accent-yellow); padding: 15px; border-radius: 8px; margin-bottom: 25px; }
    .info-row p { margin: 0 0 4px 0; font-size: 14px; color: var(--text-gray); }
    .info-row p strong { color: white; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 12px; color: var(--accent-yellow); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group select, .form-group input { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 8px; font-family: inherit; font-size: 14px; }
    .form-group select:focus, .form-group input:focus { outline: none; border-color: var(--accent-yellow); }

    .error-message { color: #ef4444; font-size: 13px; margin-bottom: 15px; min-height: 18px; }
    .success-message { color: #34d399; font-size: 13px; margin-bottom: 15px; min-height: 18px; }

    .save-btn { background: var(--accent-yellow); color: #111827; border: none; padding: 14px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 14px; transition: 0.2s; font-family: inherit; }
    .save-btn:hover:not(:disabled) { opacity: 0.9; }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .logout-btn { width: 100%; margin-top: 15px; background: none; border: 1px solid #ef4444; color: #ef4444; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit; transition: 0.2s; }
    .logout-btn:hover { background: #ef4444; color: white; }

    @media (max-width: 768px) {
      nav { padding: 15px 20px; }
      .container { padding: 20px; }
    }
  </style>
</head>

<body>
  <nav>
    <div class="logo"><div class="logo-icon">🎓</div> PathFinder</div>
    <div class="nav-links">
      <a href="studentdashboard.html">Browse</a>
      <a href="myapplication.html">My Applications</a>
      <a href="messaging.html">Messages</a>
      <a href="studentprofile.html" class="active">Profile</a>
    </div>
    <div class="profile-area">
      <span id="user-name-display">Loading...</span>
      <div class="avatar" id="user-initial">?</div>
    </div>
  </nav>

  <div class="container">
    <h1>My Profile</h1>
    <p class="subtitle">Keep your school and grade up to date</p>

    <div class="card">
      <div class="info-row">
        <p><strong id="profileName">...</strong></p>
        <p id="profileEmail">...</p>
      </div>

      <div class="error-message" id="error"></div>
      <div class="success-message" id="success"></div>

      <div class="form-group">
        <label for="school">School</label>
        <select id="school">
          <option value="">Loading schools...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="grade">Grade</label>
        <select id="grade">
          <option value="Grade 8 / Year 9">Grade 8 / Year 9</option>
          <option value="Grade 9 / Year 10">Grade 9 / Year 10</option>
          <option value="Grade 10 / Year 11">Grade 10 / Year 11</option>
          <option value="Grade 11 / Year 12">Grade 11 / Year 12</option>
          <option value="Grade 12 / Year 13">Grade 12 / Year 13</option>
        </select>
      </div>

      <button class="save-btn" id="saveBtn" onclick="saveProfile()">Save Changes</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <script>
    let currentUser = null;

    requireAuth(async (user, profile) => {
      currentUser = user;
      if (profile) {
        safeText('user-name-display', profile.name);
        safeText('profileName', profile.name);
        safeText('profileEmail', profile.email);
        const initialEl = document.getElementById('user-initial');
        if (initialEl && profile.name) initialEl.textContent = profile.name.charAt(0).toUpperCase();

        await loadSchools(profile.school);
        document.getElementById('grade').value = profile.grade || 'Grade 8 / Year 9';
      }
    });

    async function loadSchools(currentSchool) {
      const select = document.getElementById('school');
      const { data, error } = await db.from('schools').select('name').order('name');

      if (error || !data || data.length === 0) {
        console.error('Schools load error:', error);
        select.innerHTML = '<option value="">Unable to load schools</option>';
        return;
      }

      select.innerHTML = data.map(s => `<option value="${escapeHTML(s.name)}">${escapeHTML(s.name)}</option>`).join('');
      if (currentSchool) select.value = currentSchool;
    }

    async function saveProfile() {
      const errorDiv = document.getElementById('error');
      const successDiv = document.getElementById('success');
      const saveBtn = document.getElementById('saveBtn');
      errorDiv.textContent = '';
      successDiv.textContent = '';

      const school = document.getElementById('school').value;
      const grade = document.getElementById('grade').value;

      if (!school) {
        errorDiv.textContent = 'Please select a school.';
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      const { error } = await db
        .from('users')
        .update({ school, grade })
        .eq('id', currentUser.id);

      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Changes';

      if (error) {
        console.error('Profile update error:', error);
        errorDiv.textContent = 'Could not save your profile: ' + error.message;
        return;
      }

      successDiv.textContent = 'Profile updated!';
    }

    async function logout() {
      await auth.signOut();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
