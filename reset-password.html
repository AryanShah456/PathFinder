<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PathFinder | Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255, 200, 80, 0.15), transparent 40%),
        radial-gradient(circle at bottom right, rgba(255, 170, 0, 0.12), transparent 45%),
        #0b0f14;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: white;
    }
    .card {
      background: #111827;
      padding: 40px;
      width: 360px;
      border-radius: 12px;
      border: 1px solid rgba(255, 200, 80, 0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    h1 { font-size: 24px; margin-bottom: 8px; color: #facc15; }
    p.subtitle { font-size: 14px; color: #9ca3af; margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; }
    input {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1f2937;
      background: #0f172a; color: white; font-family: inherit; font-size: 14px;
      box-sizing: border-box; transition: 0.2s;
    }
    input:focus { outline: none; border-color: #facc15; }
    input.error { border-color: #ef4444; }
    button {
      width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 600;
      cursor: pointer; margin-bottom: 10px; font-family: inherit; font-size: 14px;
      transition: 0.2s; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white;
    }
    button:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-message { color: #f87171; font-size: 13px; text-align: center; margin-bottom: 15px; min-height: 20px; }
    .info-message { color: #34d399; font-size: 13px; text-align: center; margin-bottom: 15px; min-height: 20px; }
    a.back-link { display: block; text-align: center; font-size: 13px; color: #60a5fa; text-decoration: none; margin-top: 10px; }
    a.back-link:hover { color: #93c5fd; }
  </style>
</head>
<body>
  <div class="login-card card">
    <h1>Set a New Password</h1>
    <p class="subtitle" id="subtitle">Enter your new password below.</p>

    <div class="form-group">
      <input type="password" id="password" placeholder="New password" autocomplete="new-password">
    </div>
    <div class="form-group">
      <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">
    </div>

    <div class="error-message" id="error"></div>
    <div class="info-message" id="info"></div>

    <button id="saveBtn" onclick="updatePassword()">Update Password</button>
    <a class="back-link" href="login.html">Back to login</a>
  </div>

  <script>
    const errorDiv = document.getElementById('error');
    const infoDiv = document.getElementById('info');
    const saveBtn = document.getElementById('saveBtn');
    let readyForReset = false;

    // Supabase sends the user here with a recovery token in the URL; the
    // JS client picks it up automatically and fires a PASSWORD_RECOVERY
    // event once it has established a temporary session for the reset.
    auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        readyForReset = true;
      }
    });

    // Fallback: if a session already exists (link was already consumed in
    // this tab), still allow the form to be used.
    auth.getSession().then(({ data: { session } }) => {
      if (session) readyForReset = true;
    });

    async function updatePassword() {
      errorDiv.textContent = '';
      infoDiv.textContent = '';

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!password || password.length < 6) {
        errorDiv.textContent = 'Password must be at least 6 characters.';
        return;
      }
      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match.';
        return;
      }
      if (!readyForReset) {
        errorDiv.textContent = 'This reset link is invalid or has expired. Please request a new one from the login page.';
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Updating...';

      const { error } = await auth.updateUser({ password });

      if (error) {
        errorDiv.textContent = 'Could not update password: ' + error.message;
        saveBtn.disabled = false;
        saveBtn.textContent = 'Update Password';
        return;
      }

      infoDiv.textContent = 'Password updated! Redirecting to login...';
      setTimeout(() => {
        auth.signOut().finally(() => { window.location.href = 'login.html'; });
      }, 1500);
    }
  </script>
</body>
</html>
