<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PathFinder | Browse Opportunities</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  
  <style>
    :root {
      --bg-dark: #0b0f14;
      --card-bg: #111827;
      --accent-yellow: #facc15;
      --text-gray: #9ca3af;
      --input-bg: #0f172a;
      --border-color: #1f2937;
      --blue: #2563eb;
    }
    
    * { box-sizing: border-box; }
    
    body {
      background: var(--bg-dark);
      color: white;
      font-family: 'Inter', sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    
    /* Navbar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 60px;
      background: rgba(17, 24, 39, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      font-weight: 700; 
      font-size: 20px; 
    }
    .logo-icon { 
      background: var(--accent-yellow); 
      color: black; 
      padding: 5px; 
      border-radius: 6px; 
    }
    .nav-links { 
      display: flex; 
      gap: 30px; 
      font-size: 14px; 
    }
    .nav-links a { 
      color: var(--text-gray); 
      text-decoration: none; 
      transition: 0.3s; 
    }
    .nav-links a:hover, 
    .nav-links a.active { 
      color: white; 
    }
    .profile-area { 
      display: flex; 
      align-items: center; 
      gap: 15px; 
      font-size: 14px; 
    }
    .avatar { 
      width: 32px; 
      height: 32px; 
      border-radius: 50%; 
      background: var(--blue); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: white;
      font-weight: 600;
      font-size: 14px;
    }
    .logout-btn {
      background: none; 
      border: 1px solid #ef4444; 
      color: #ef4444;
      padding: 6px 14px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 12px;
      transition: 0.2s;
    }
    .logout-btn:hover {
      background: #ef4444;
      color: white;
    }

    /* Main Content */
    .container { 
      padding: 40px 60px; 
      max-width: 1200px; 
      margin: 0 auto; 
    }
    h1 { 
      font-size: 32px; 
      margin-bottom: 10px; 
    }
    .subtitle { 
      color: var(--text-gray); 
      margin-bottom: 40px; 
      font-size: 16px;
    }

    /* Search & Filter */
    .filter-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .search-input {
      flex-grow: 1;
      min-width: 250px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      font-family: inherit;
      font-size: 14px;
      transition: 0.2s;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent-yellow);
    }
    .filter-select {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: white;
      padding: 12px 15px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      min-width: 150px;
    }
    .filter-select:focus {
      outline: none;
      border-color: var(--accent-yellow);
    }

    /* Opportunities Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
    }
    
    .opportunity-card {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 24px;
      transition: 0.3s;
      display: flex;
      flex-direction: column;
    }
    .opportunity-card:hover { 
      transform: translateY(-5px); 
      border-color: var(--accent-yellow); 
    }
    
    .tag-row { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 15px; 
      flex-wrap: wrap;
    }
    .tag { 
      padding: 4px 12px; 
      border-radius: 100px; 
      font-size: 11px; 
      font-weight: 600; 
      border: 1px solid;
    }
    .tag-intern { 
      background: rgba(250, 204, 21, 0.1); 
      color: var(--accent-yellow); 
      border-color: rgba(250, 204, 21, 0.3); 
    }
    .tag-shadow { 
      background: rgba(37, 99, 235, 0.1); 
      color: #60a5fa; 
      border-color: rgba(37, 99, 235, 0.3); 
    }
    
    .card-title { 
      font-size: 20px; 
      margin: 0 0 8px 0; 
      font-weight: 600;
    }
    .company { 
      color: var(--text-gray); 
      font-size: 14px; 
      margin-bottom: 15px; 
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .description { 
      font-size: 14px; 
      color: var(--text-gray); 
      line-height: 1.6; 
      margin-bottom: 20px; 
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      color: var(--accent-yellow);
      font-size: 13px;
      margin-bottom: 20px;
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .details-btn {
      width: 100%;
      padding: 12px;
      background: rgba(37, 99, 235, 0.1);
      color: #60a5fa;
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      transition: 0.2s;
      font-family: inherit;
      font-size: 14px;
    }
    .details-btn:hover {
      background: rgba(37, 99, 235, 0.2);
      color: #93c5fd;
    }

    /* Loading & Empty States */
    .loading-container {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-gray);
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-gray);
    }
    .empty-state h3 {
      color: white;
      margin-bottom: 10px;
    }
    .error-state {
      text-align: center;
      padding: 60px 20px;
      color: #ef4444;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      nav { padding: 15px 20px; }
      .container { padding: 20px; }
      .grid { grid-template-columns: 1fr; }
      .filter-bar { flex-direction: column; }
    }
  </style>
</head>

<body>
  <nav>
    <div class="logo">
      <div class="logo-icon">🎓</div> PathFinder
    </div>
    <div class="nav-links">
      <a href="studentdashboard.html" class="active">Browse</a>
      <a href="myapplication.html">My Applications</a>
      <a href="messaging.html">Messages</a>
    </div>
    <div class="profile-area">
      <span id="user-name-display">Loading...</span>
      <div class="avatar" id="user-initial">?</div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <h1>Browse Opportunities</h1>
    <p class="subtitle">Discover internships and job shadowing experiences from our community</p>

    <div class="filter-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="Search by title, company, or description..." onkeyup="filterOpportunities()">
      <select class="filter-select" id="typeFilter" onchange="filterOpportunities()">
        <option value="all">All Types</option>
        <option value="Internship">Internship</option>
        <option value="Job Shadowing">Job Shadowing</option>
      </select>
      <select class="filter-select" id="sortFilter" onchange="filterOpportunities()">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
      </select>
    </div>

    <div id="opportunity-grid" class="grid">
      <div class="loading-container">
        <p>Loading opportunities...</p>
      </div>
    </div>
  </div>

  <script>
    let allOpportunities = []; // Cache for client-side filtering
    let opportunitiesListener = null;

    // Auth guard + init
    requireAuth(user => {
      loadUserProfile(user.uid);
      loadOpportunities();
    });

    function loadUserProfile(uid) {
      db.collection("users").doc(uid).get()
        .then(doc => {
          if (doc.exists) {
            const name = doc.data().name || 'Student';
            safeText('user-name-display', name);
            const initialEl = document.getElementById('user-initial');
            if (initialEl) initialEl.textContent = name.charAt(0).toUpperCase();
          }
        })
        .catch(err => console.error('Profile load error:', err));
    }

    function loadOpportunities() {
      const grid = document.getElementById('opportunity-grid');
      
      // Clean up old listener if any
      if (opportunitiesListener) opportunitiesListener();

      opportunitiesListener = db.collection("opportunities")
        .where("listingStatus", "==", "Open")
        .orderBy("createdAt", "desc")
        .onSnapshot(snapshot => {
          allOpportunities = [];
          
          snapshot.forEach(doc => {
            allOpportunities.push({
              id: doc.id,
              ...doc.data()
            });
          });
          
          filterOpportunities();
        }, err => {
          console.error('Opportunities load error:', err);
          grid.innerHTML = `
            <div class="error-state" style="grid-column: 1 / -1;">
              <h3>Failed to load opportunities</h3>
              <p>${err.message}</p>
              <button onclick="loadOpportunities()" class="details-btn" style="margin-top: 15px; max-width: 200px;">Retry</button>
            </div>
          `;
        });
    }

    function filterOpportunities() {
      const grid = document.getElementById('opportunity-grid');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      const typeFilter = document.getElementById('typeFilter').value;
      const sortFilter = document.getElementById('sortFilter').value;

      // Filter
      let filtered = allOpportunities.filter(opp => {
        const matchesSearch = !searchQuery || 
          (opp.title && opp.title.toLowerCase().includes(searchQuery)) ||
          (opp.parentName && opp.parentName.toLowerCase().includes(searchQuery)) ||
          (opp.description && opp.description.toLowerCase().includes(searchQuery));
        
        const matchesType = typeFilter === 'all' || opp.type === typeFilter;
        
        return matchesSearch && matchesType;
      });

      // Sort
      if (sortFilter === 'oldest') {
        filtered.reverse();
      }

      // Render
      grid.innerHTML = '';
      
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <h3>No opportunities found</h3>
            <p>Try adjusting your search or filters.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(data => {
        const card = document.createElement('div');
        card.className = 'opportunity-card';

        // Tag
        const tagRow = document.createElement('div');
        tagRow.className = 'tag-row';
        const tag = document.createElement('span');
        tag.className = 'tag ' + (data.type === 'Job Shadowing' ? 'tag-shadow' : 'tag-intern');
        tag.textContent = data.type || 'Internship';
        tagRow.appendChild(tag);

        // Title
        const title = document.createElement('h3');
        title.className = 'card-title';
        title.textContent = data.title || 'Untitled Opportunity';

        // Company
        const company = document.createElement('div');
        company.className = 'company';
        company.innerHTML = '🏢 ' + (data.parentName || 'Community Member');

        // Description
        const desc = document.createElement('p');
        desc.className = 'description';
        desc.textContent = data.description || 'No description provided.';

        // Meta
        const meta = document.createElement('div');
        meta.className = 'meta-row';
        
        const duration = document.createElement('span');
        duration.className = 'meta-item';
        duration.textContent = '⏱️ ' + (data.duration || 'TBD');
        
        const spots = document.createElement('span');
        spots.className = 'meta-item';
        spots.textContent = '👥 ' + (data.spots || '1') + ' spot' + (data.spots > 1 ? 's' : '');
        
        meta.appendChild(duration);
        meta.appendChild(spots);

        // Button
        const btn = document.createElement('a');
        btn.className = 'details-btn';
        btn.href = 'apply.html?id=' + data.id;
        btn.textContent = 'View Details';

        // Assemble
        card.appendChild(tagRow);
        card.appendChild(title);
        card.appendChild(company);
        card.appendChild(desc);
        card.appendChild(meta);
        card.appendChild(btn);

        grid.appendChild(card);
      });
    }

    function logout() {
      auth.signOut().then(() => {
        window.location.href = 'login.html';
      });
    }
  </script>
</body>
</html>
